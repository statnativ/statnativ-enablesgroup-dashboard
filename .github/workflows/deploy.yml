name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public-safe by design: this is Supabase's "publishable" key, meant to
      # be embedded in client-side bundles (real access control is Row Level
      # Security in Postgres, not secrecy of this key). See README.md.
      VITE_SUPABASE_URL: https://fhxnuhaobgjbqypnyqdx.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Hm0o7QmrK0pi9e0tr3LfFQ_CD1niYSx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # React Router client-side routes (e.g. /dashboard/documents) need to
      # fall back to index.html on a direct load/refresh — GitHub Pages has
      # no server-side rewrites, so serve the SPA shell for any unknown path.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
